---
name: ci
"on":
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.1
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write
  integration-windows:
    needs: lint-unit
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        suite: [default, remove]
        platform: [windows-2022, windows-2025]
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Cinc Workstation
        uses: sous-chefs/.github/.github/actions/install-workstation@9.0.1
      - name: Test installed state and removal
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.exec.yml
        run: |
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          chef exec kitchen test ${{ matrix.suite }}-windows-latest --destroy=always
      - name: Collect WiX installer diagnostics
        if: failure()
        run: |
          New-Item -ItemType Directory -Path wix-logs -Force | Out-Null
          Get-ChildItem "$env:TEMP/kitchen/cache/wix-install.log" -ErrorAction SilentlyContinue |
            Copy-Item -Destination wix-logs
      - name: Upload WiX installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wix-${{ matrix.suite }}-${{ matrix.platform }}
          path: wix-logs/*.log
          if-no-files-found: warn
